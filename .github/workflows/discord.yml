name: Discord Notification

on:
  push:
  pull_request:
  release:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"GitHub Event: $GITHUB_EVENT_NAME\",
              \"color\": 5793266,
              \"fields\": [
                {
                  \"name\": \"Repository\",
                  \"value\": \"$GITHUB_REPOSITORY\",
                  \"inline\": true
                },
                {
                  \"name\": \"User\",
                  \"value\": \"$GITHUB_ACTOR\",
                  \"inline\": true
                },
                {
                  \"name\": \"Branch\",
                  \"value\": \"$GITHUB_REF_NAME\",
                  \"inline\": true
                },
                {
                  \"name\": \"Commit SHA\",
                  \"value\": \"$GITHUB_SHA\",
                  \"inline\": false
                },
                {
                  \"name\": \"Commit URL\",
                  \"value\": \"https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA\",
                  \"inline\": false
                },
                {
                  \"name\": \"Time\",
                  \"value\": \"$(date -u)\",
                  \"inline\": false
                }
              ]
            }]
          }" \
          $DISCORD_WEBHOOK