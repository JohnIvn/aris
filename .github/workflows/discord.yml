name: Discord Notification

on:
  push:
  pull_request:
  release:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Commit and PR Notifications
        if: github.event_name != 'release'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"GitHub Event: $GITHUB_EVENT_NAME\",
              \"color\": 5793266,
              \"fields\": [
                {
                  \"name\": \"Repository\",
                  \"value\": \"$GITHUB_REPOSITORY\",
                  \"inline\": true
                },
                {
                  \"name\": \"User\",
                  \"value\": \"$GITHUB_ACTOR\",
                  \"inline\": true
                },
                {
                  \"name\": \"Branch\",
                  \"value\": \"$GITHUB_REF_NAME\",
                  \"inline\": true
                },
                {
                  \"name\": \"Commit\",
                  \"value\": \"$GITHUB_SHA\",
                  \"inline\": false
                }
              ]
            }]
          }" \
          $DISCORD_WEBHOOK

      - name: Send Release Notifications
        if: github.event_name == 'release'
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          curl \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"GitHub Release\",
              \"color\": 10181046,
              \"fields\": [
                {
                  \"name\": \"Repository\",
                  \"value\": \"$GITHUB_REPOSITORY\",
                  \"inline\": true
                },
                {
                  \"name\": \"User\",
                  \"value\": \"$GITHUB_ACTOR\",
                  \"inline\": true
                },
                {
                  \"name\": \"Release\",
                  \"value\": \"${{ github.event.release.tag_name }}\",
                  \"inline\": true
                },
                {
                  \"name\": \"URL\",
                  \"value\": \"${{ github.event.release.html_url }}\",
                  \"inline\": false
                }
              ]
            }]
          }" \
          $DISCORD_RELEASE_WEBHOOK

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect sensitive files
        id: scan
        run: |
          FOUND=$(git ls-tree -r HEAD --name-only | grep -E "node_modules|\.env|\.pem|\.key|secret|password" || true)

          if [ -n "$FOUND" ]; then
            echo "detected=true" >> $GITHUB_OUTPUT
            echo "$FOUND" > detected.txt
          else
            echo "detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Send Security Alert
        if: steps.scan.outputs.detected == 'true'
        env:
          DISCORD_SECURITY_WEBHOOK: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
        run: |
          FILES=$(cat detected.txt)

          curl \
          -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"Security Warning: Sensitive Files Detected\",
              \"color\": 16711680,
              \"fields\": [
                {
                  \"name\": \"Repository\",
                  \"value\": \"$GITHUB_REPOSITORY\"
                },
                {
                  \"name\": \"User\",
                  \"value\": \"$GITHUB_ACTOR\"
                },
                {
                  \"name\": \"Detected Files\",
                  \"value\": \"$FILES\"
                },
                {
                  \"name\": \"Commit\",
                  \"value\": \"$GITHUB_SHA\"
                }
              ]
            }]
          }" \
          $DISCORD_SECURITY_WEBHOOK
