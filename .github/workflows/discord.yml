name: Discord Notification

on:
  push:
  pull_request:
  release:

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl \
          -H "Content-Type: application/json" \
          -d "{\"content\":\"🚀 GitHub Event: $GITHUB_EVENT_NAME\nRepository: $GITHUB_REPOSITORY\nUser: $GITHUB_ACTOR\"}" \
          $DISCORD_WEBHOOK
